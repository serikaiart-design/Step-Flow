name: Vendor remaining individual icons
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  vendor-icons:
    if: github.event.head_commit.message == 'Убрать все повторяющиеся значки'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download product-specific icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin python3-pil
          mkdir -p /tmp/logos assets/program-icons
          python3 - <<'PY'
          import pathlib, urllib.request, urllib.parse
          out=pathlib.Path('/tmp/logos')
          files={
            'microsoft-365':'Microsoft 365 (2022).svg',
            'webview2':'Microsoft Edge logo (2019).svg',
            'dotnet':'Microsoft .NET logo.svg',
            'directx':'Microsoft-DirectX-Logo-wordmark.svg',
            'directx-2010':'Microsoft-DirectX-10-Logo-wordmark.svg',
            'windows11':'Windows logo - 2021.svg',
            'windows10-ltsc':'Windows 10 Logo.svg'
          }
          for slug,name in files.items():
              url='https://commons.wikimedia.org/wiki/Special:Redirect/file/'+urllib.parse.quote(name)
              req=urllib.request.Request(url,headers={'User-Agent':'Step-Flow/1.0'})
              data=urllib.request.urlopen(req,timeout=45).read()
              (out/(slug+'.svg')).write_bytes(data)
              print(slug,len(data))
          extras={
            'visual-cpp':'https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/cplusplus.svg',
            'wise-disk':'https://www.wisecleaner.com/static/img/product/wise-disk-cleaner/wisefolderhider_icon.png',
            'wise-registry':'https://www.wisecleaner.com/static/img/product/wise-registry-cleaner/wiseregistrycleaner_icon.png'
          }
          for slug,url in extras.items():
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              data=urllib.request.urlopen(req,timeout=45).read()
              ext='.svg' if slug=='visual-cpp' else '.png'
              (out/(slug+ext)).write_bytes(data)
              print(slug,len(data))
          PY
          for f in /tmp/logos/*.svg; do
            name="$(basename "$f" .svg)"
            rsvg-convert -w 128 -h 128 "$f" -o "assets/program-icons/$name.png"
          done
          python3 - <<'PY'
          from PIL import Image
          import pathlib
          for slug in ('wise-disk','wise-registry'):
              im=Image.open('/tmp/logos/'+slug+'.png').convert('RGBA')
              im.thumbnail((128,128),Image.Resampling.LANCZOS)
              canvas=Image.new('RGBA',(128,128),(0,0,0,0))
              canvas.alpha_composite(im,((128-im.width)//2,(128-im.height)//2))
              canvas.save('assets/program-icons/'+slug+'.png')
          PY
      - name: Commit individual local icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/program-icons
          git commit -m "Убрать повторы локальных значков [skip ci]"
          git push
