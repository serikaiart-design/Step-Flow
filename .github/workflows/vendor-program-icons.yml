name: Vendor native Sysinternals icons
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  vendor-native-icons:
    if: github.event.head_commit.message == 'Добавить родные значки Sysinternals'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract native icons from official Microsoft archives
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq icoutils python3-pil
          mkdir -p /tmp/native-icons/autoruns /tmp/native-icons/procexp /tmp/native-icons/extracted assets/program-icons
          curl -fL --retry 3 -o /tmp/native-icons/autoruns.zip https://download.sysinternals.com/files/Autoruns.zip
          curl -fL --retry 3 -o /tmp/native-icons/procexp.zip https://download.sysinternals.com/files/ProcessExplorer.zip
          unzip -oq /tmp/native-icons/autoruns.zip -d /tmp/native-icons/autoruns
          unzip -oq /tmp/native-icons/procexp.zip -d /tmp/native-icons/procexp
          wrestool -x -t 14 /tmp/native-icons/autoruns/Autoruns64.exe > /tmp/native-icons/extracted/autoruns.ico
          wrestool -x -t 14 /tmp/native-icons/procexp/procexp64.exe > /tmp/native-icons/extracted/process-explorer.ico
          python3 - <<'PY'
          from PIL import Image
          import pathlib
          for ico in pathlib.Path('/tmp/native-icons/extracted').glob('*.ico'):
              im=Image.open(ico); best=None
              for i in range(getattr(im,'n_frames',1)):
                  im.seek(i); frame=im.convert('RGBA')
                  if best is None or frame.width*frame.height>best.width*best.height: best=frame.copy()
              best.thumbnail((128,128),Image.Resampling.LANCZOS)
              best.save(pathlib.Path('assets/program-icons')/(ico.stem+'.png'))
              print(ico.stem,best.size)
          PY
      - name: Commit native local icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/program-icons/autoruns.png assets/program-icons/process-explorer.png
          git commit -m "Добавить родные значки Sysinternals [skip ci]"
          git push
