name: Vendor native program icons
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  vendor-native-icons:
    if: github.event.head_commit.message == 'Заменить общие значки на родные'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract native icons from official program files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq icoutils python3-pil
          mkdir -p /tmp/native-icons assets/program-icons
          curl -fL --retry 3 -o /tmp/native-icons/autoruns.zip https://download.sysinternals.com/files/Autoruns.zip
          curl -fL --retry 3 -o /tmp/native-icons/procexp.zip https://download.sysinternals.com/files/ProcessExplorer.zip
          unzip -oq /tmp/native-icons/autoruns.zip -d /tmp/native-icons/autoruns
          unzip -oq /tmp/native-icons/procexp.zip -d /tmp/native-icons/procexp
          python3 - <<'PY'
          import re, urllib.request, pathlib
          pages={
            'wise-disk':'https://www.wisecleaner.com/wise-disk-cleaner.html',
            'wise-registry':'https://www.wisecleaner.com/wise-registry-cleaner.html'
          }
          out=pathlib.Path('/tmp/native-icons')
          for slug,url in pages.items():
              html=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})).read().decode('utf-8','ignore')
              links=re.findall(r'href=["\']([^"\']+\.exe(?:\?[^"\']*)?)',html,re.I)
              if not links: raise RuntimeError('No official installer link for '+slug)
              link=urllib.parse.urljoin(url,links[0])
              data=urllib.request.urlopen(urllib.request.Request(link,headers={'User-Agent':'Mozilla/5.0'})).read()
              (out/(slug+'.exe')).write_bytes(data)
              print(slug,link,len(data))
          PY
          mkdir -p /tmp/native-icons/extracted
          wrestool -x -t 14 /tmp/native-icons/autoruns/Autoruns64.exe > /tmp/native-icons/extracted/autoruns.ico
          wrestool -x -t 14 /tmp/native-icons/procexp/procexp64.exe > /tmp/native-icons/extracted/process-explorer.ico
          wrestool -x -t 14 /tmp/native-icons/wise-disk.exe > /tmp/native-icons/extracted/wise-disk.ico
          wrestool -x -t 14 /tmp/native-icons/wise-registry.exe > /tmp/native-icons/extracted/wise-registry.ico
          python3 - <<'PY'
          from PIL import Image
          import pathlib
          src=pathlib.Path('/tmp/native-icons/extracted')
          dst=pathlib.Path('assets/program-icons')
          for ico in src.glob('*.ico'):
              im=Image.open(ico)
              best=None
              for i in range(getattr(im,'n_frames',1)):
                  im.seek(i)
                  frame=im.convert('RGBA')
                  if best is None or frame.width*frame.height>best.width*best.height:
                      best=frame.copy()
              best.thumbnail((128,128),Image.Resampling.LANCZOS)
              best.save(dst/(ico.stem+'.png'))
              print(ico.stem,best.size)
          PY
      - name: Commit native local icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/program-icons
          git commit -m "Добавить родные локальные значки [skip ci]"
          git push
