name: FSM Safety Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fsm-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run FSM transition check
        run: npm test
